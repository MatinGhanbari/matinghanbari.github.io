<body>
    <!-- Google Tag Manager (noscript) -->

        <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJXJLHCN"
                height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="app">
        <div class="position-fixed top-0 start-0 w-100 vh-100 d-flex justify-content-center align-items-center"
             style="z-index: 999; background-color: #11100E !important;">

            <img src="/images/logo/logo-white.webp"
                 class="img-fluid"
                 style="width: 40%; max-width: 300px; rotate: 10deg;"
                 alt="Logo">

            <div class="position-absolute bottom-0 w-100 text-center pb-4" style="font-size: 0.7rem;">
                <!-- Line 1: Spinner and Loading Text -->
                <div class="d-flex align-items-center justify-content-center mb-1">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid"
                         style="width: 1.25rem; height: 1.25rem; background: transparent; shape-rendering: auto; display: block;">
                        <g>
                            <!-- Primary White Pulse -->
                            <circle stroke-width="3" stroke="#ffffff" fill="none" r="0" cy="50" cx="50">
                                <animate begin="0s" calcMode="spline" keySplines="0 0.2 0.8 1" keyTimes="0;1" values="0;40" dur="1.2s" repeatCount="indefinite" attributeName="r" />
                                <animate begin="0s" calcMode="spline" keySplines="0.2 0 0.8 1" keyTimes="0;1" values="1;0" dur="1.2s" repeatCount="indefinite" attributeName="opacity" />
                            </circle>
                            <!-- Secondary Gray Pulse -->
                            <circle stroke-width="3" stroke="#6c757d" fill="none" r="0" cy="50" cx="50">
                                <animate begin="-0.6s" calcMode="spline" keySplines="0 0.2 0.8 1" keyTimes="0;1" values="0;40" dur="1.2s" repeatCount="indefinite" attributeName="r" />
                                <animate begin="-0.6s" calcMode="spline" keySplines="0.2 0 0.8 1" keyTimes="0;1" values="1;0" dur="1.2s" repeatCount="indefinite" attributeName="opacity" />
                            </circle>
                        </g>
                    </svg>
                    <span class="text-white opacity-75 small font-monospace ms-2">
                        Loading...
                    </span>
                </div>

                <!-- Line 2: Version Info -->
                <div class="text-white opacity-50 small font-monospace">
                    v1.0 &middot; Built with Blazor WebAssembly
                </div>
            </div>
        </div>
    </div>
